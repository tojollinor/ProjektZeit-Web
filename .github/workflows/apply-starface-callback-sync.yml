name: Apply STARFACE callback sync

on:
  push:
    branches: [automation/apply-starface-callback-sync]
    paths: ['.github/workflows/apply-starface-callback-sync.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested callback sync patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/starface-callback-sync
          git checkout -B feat/starface-callback-sync origin/feat/starface-callback-sync
          echo '' | base64 -d | gzip -d > /tmp/starface.patch
          git apply --check /tmp/starface.patch
          git apply /tmp/starface.patch
          python -m py_compile starface_calls.py final_batch_runtime.py next_batch_runtime.py
          python -m unittest tests.test_starface_calls tests.test_final_batch
          node --check static/next-batch-ui.js
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email '109473660+tojollinor@users.noreply.github.com'
          git add starface_calls.py final_batch_runtime.py next_batch_runtime.py static/next-batch-ui.js tests/test_starface_calls.py tests/test_final_batch.py UPDATE-0.8.0.md
          git commit -m 'feat: sync callback status to STARFACE'
          git push origin HEAD:feat/starface-callback-sync
