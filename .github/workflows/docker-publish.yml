name: Docker-Image veröffentlichen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_ROOT_HOST: '%'
        ports:
          - 33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests ausführen
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile *.py
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/timeline.cjs
          node tests/starface-ui.cjs
          node --check static/starface-connect.js
          node --check static/portal.js
          node --check static/customer-master.js
          node --check static/ui-next.js
          node --check static/ui-fixes.js
          node --check static/ux-batch.js
          node --check static/provider-api-ui.js
          node --check static/network-guard.js
          node --check static/work-panel-ui.js
          node --check static/zammad-ticket-ui.js
          node --check static/zammad-cache-ui.js
          node --check static/provider-nav-status.js
          node --check static/customer-extra-ui.js
          node --check static/ux-round2.js
          node --check static/next-batch-ui.js
          node --check static/next-batch-fixes.js
          node --check static/frontend-update.js

      - name: Runtime-Stack initialisieren
        env:
          DATA_DIR: /tmp/projektzeit-runtime-smoke
          DEMO_MODE: '1'
          SEED_DEMO: '0'
          ADMIN_USER: ciadmin
          ADMIN_PASSWORD: ci-runtime-password-2026
        run: |
          python -c "import app, customer_runtime, feature_runtime, contact_runtime, ux_runtime, provider_cache_runtime, api_runtime, zammad_cache_runtime, provider_nav_runtime, worktime_runtime, customer_extra_runtime, next_batch_runtime, frontend_update_runtime; customer_runtime.install(app); feature_runtime.install(app); contact_runtime.install(app); ux_runtime.install(app); provider_cache_runtime.install(app); api_runtime.install(app); zammad_cache_runtime.install(app); provider_nav_runtime.install(app); worktime_runtime.install(app); customer_extra_runtime.install(app); next_batch_runtime.install(app); frontend_update_runtime.install(app); app.init_db(); print('Runtime-Stack erfolgreich initialisiert')"

      - name: Tests gegen MariaDB
        env:
          PZ_TEST_MARIADB: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '33306'
          DB_USER: root
          DB_PASSWORD: ci-only-password
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
