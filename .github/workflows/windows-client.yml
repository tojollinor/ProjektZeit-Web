name: Windows-Client bauen
on:
  push:
    branches: [main]
    paths: ['windows-client/**', 'static/projektzeit-logo.png', '.github/workflows/windows-client.yml']
  pull_request:
    branches: [main]
    paths: ['windows-client/**', 'static/projektzeit-logo.png', '.github/workflows/windows-client.yml']
  workflow_dispatch:
concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish windows-client/ProjektZeit.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ProjektZeit-Windows
          path: dist/ProjektZeit-Windows.exe
      - name: Windows-Download veröffentlichen
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-client --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-client --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ProjektZeit Windows-Client" --notes "Windows-Client für ProjektZeit und STARFACE-Anmeldung. Unsignierte EXE; siehe windows-client/README.md." --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht angelegt werden." }
          }
          gh release upload windows-client dist/ProjektZeit-Windows.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload fehlgeschlagen." }
