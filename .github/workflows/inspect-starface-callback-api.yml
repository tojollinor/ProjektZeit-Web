name: Inspect STARFACE callback API

on:
  push:
    branches: [automation/inspect-starface-callback-api]
    paths: ['.github/workflows/inspect-starface-callback-api.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve UCI 3.0.3 download and inspect call-list interface
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://knowledge.starface.de/pages/viewpage.action?pageId=46564626'
          curl -fL --retry 3 --max-time 60 -A 'Mozilla/5.0' "$PAGE" -o /tmp/uci.html || true
          echo '=== Links around UCI 3.0.3 ==='
          python - <<'PY'
          import re, html
          from pathlib import Path
          s=Path('/tmp/uci.html').read_text(errors='ignore') if Path('/tmp/uci.html').exists() else ''
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',s,re.I|re.S):
              href=html.unescape(m.group(1)); text=re.sub('<[^>]+>',' ',m.group(2)); text=' '.join(html.unescape(text).split())
              if '3.0.3' in text or '3.0.3' in href or ('demopack' in text.lower() and 'uci' in text.lower()):
                  print(text,'=>',href)
          PY
          echo '=== Attachment/download URLs ==='
          grep -Eo 'https?://[^"<> ]+|/download/attachments/[^"<> ]+|/pages/downloadallattachments.action[^"<> ]*' /tmp/uci.html 2>/dev/null | sed 's/&amp;/\&/g' | grep -iE 'uci|46564626|zip|jar' | head -200 || true
          echo '=== Page snippets ==='
          grep -ioE '.{0,180}UCI.{0,80}3\.0\.3.{0,300}' /tmp/uci.html | head -40 || true
