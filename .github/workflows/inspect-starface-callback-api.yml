name: Inspect STARFACE callback API

on:
  push:
    branches: [automation/inspect-starface-callback-api]
    paths: ['.github/workflows/inspect-starface-callback-api.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print official UCI 3.0.3 callback interface
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.starface-cdn.de/starface/clients/starface-uci-democlient-javasource-3.0.3.zip'
          curl -fL --retry 3 --max-time 120 "$URL" -o /tmp/uci303.zip
          mkdir /tmp/uci303
          unzip -q /tmp/uci303.zip -d /tmp/uci303
          ROOT='/tmp/uci303/eai-uci/uci/src/main/java/de/starface/integration/uci/java/v30'
          echo '=== UciCallListRequests.java ==='
          cat "$ROOT/messages/requests/UciCallListRequests.java"
          echo '=== CallListEntry.java ==='
          cat "$ROOT/types/CallListEntry.java"
          echo '=== CallListEntryProperties.java ==='
          cat "$ROOT/values/CallListEntryProperties.java"
          echo '=== Called-back references ==='
          grep -RniE 'called.?back|calledback|callListEntryId' "$ROOT" || true
