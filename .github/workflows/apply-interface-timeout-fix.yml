name: Apply interface runtime timeout fix

on:
  push:
    branches: [automation/interface-runtime-timeout-080]
    paths: ['.github/workflows/apply-interface-timeout-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/interface-runtime-ci-timeout-080
          git checkout -B fix/interface-runtime-ci-timeout-080 origin/fix/interface-runtime-ci-timeout-080
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/interface-runtime.cjs')
          s=p.read_text()
          old="},30000);"
          new="},60000);"
          if old not in s:
              raise SystemExit('30s watchdog not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name "ChatGPT CI Fix"
          git config user.email "109473660+tojollinor@users.noreply.github.com"
          git add tests/interface-runtime.cjs
          git commit -m "test: allow interface runtime CI enough time"
          git push origin HEAD:fix/interface-runtime-ci-timeout-080
